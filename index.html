<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تقرير استلام أساس العارض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="st">
/* Layout: sticky tool bar over a white A4-like report sheet; admin is a full-width settings workspace with tabs */
:root{
  --gold:#B8822B; --gold-soft:#F6EEDF; --ink:#231F20; --muted:#6B6460; --line:#E3DDD3;
  --bg:#ECE8E1; --surface:#FFFFFF; --surface-2:#F7F4EE; --fg:#231F20; --fg-muted:#6B6460; --chrome:#231F20; --chrome-fg:#F7F1E6;
  --ok:#1E7A4C; --warn:#A86B00; --bad:#B3261E;
  --f-ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --f-display:"Cairo","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-paper:"Segoe UI",Tahoma,"Noto Sans Arabic","Geeza Pro",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17150F; --surface:#221F19; --surface-2:#2A261F; --fg:#F1EBE0; --fg-muted:#B4AA9B; --line:#3A352C; --chrome:#0F0E0B; --chrome-fg:#F1EBE0; --gold-soft:#3A2F1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17150F; --surface:#221F19; --surface-2:#2A261F; --fg:#F1EBE0; --fg-muted:#B4AA9B; --line:#3A352C; --chrome:#0F0E0B; --chrome-fg:#F1EBE0; --gold-soft:#3A2F1C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--chrome)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- tool bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--chrome);color:var(--chrome-fg)}
.bar-in{max-width:1100px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar-title{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.bar-title b{font-family:var(--f-display);font-size:16px}
.bar-title small{font-size:11.5px;opacity:.75}
.tb{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--chrome-fg);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;min-height:40px}
.tb:hover{background:rgba(255,255,255,.12)}
.tb.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.tb.gold:hover{filter:brightness(1.07)}
.tb svg{width:16px;height:16px;flex:none}
.tb[disabled]{opacity:.5;cursor:progress}
.save-badge{font-size:11.5px;opacity:.75;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chrome);color:var(--chrome-fg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}

.wrap{max-width:860px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.preview-banner{background:var(--gold-soft);border:1px solid var(--gold);color:var(--fg);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- report sheet (document colours stay fixed: it is paper) ---------- */
.paper{--pc:var(--gold);--pi:#231F20;--pm:#6B6460;--pl:#DDD6CB;--pf:#F7F4EE;--ph:#FBF6EC;
  container-type:inline-size;background:#fff;color:var(--pi);font-family:var(--f-paper);font-size:13px;border-radius:10px;box-shadow:0 2px 14px rgba(0,0,0,.12);overflow:hidden;color-scheme:light}
.paper.exporting{border-radius:0;box-shadow:none;width:794px}
.p-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;margin:14px;padding:14px 18px;border:1.5px solid var(--pi);border-radius:10px;position:relative}
.p-head::after{content:"";position:absolute;inset:auto 18px -1.5px;height:3px;background:var(--pc)}
.p-logo{width:118px;height:118px;display:flex;align-items:center;justify-content:center}
.p-logo img{max-width:100%;max-height:100%;object-fit:contain}
.p-foot .c span{white-space:normal}
.p-titles{text-align:center;min-width:0}
.p-co{font-size:16px;font-weight:800;color:var(--pi)}
.p-co-en{font-family:Georgia,"Times New Roman",serif;font-size:12px;letter-spacing:.6px;color:var(--pm);margin-top:2px;text-transform:uppercase}
.p-title{font-family:var(--f-display);font-size:23px;font-weight:800;margin-top:8px;color:var(--pi)}
.p-title-en{font-family:Georgia,"Times New Roman",serif;font-size:12.5px;font-weight:700;letter-spacing:.5px;color:var(--pc)}
.p-meta{border:1.5px dashed var(--pc);border-radius:8px;padding:8px 10px;min-width:150px;text-align:center}
.p-meta .row{display:flex;flex-direction:column;gap:2px;padding-bottom:6px;margin-bottom:6px;border-bottom:1px dashed var(--pl)}
.p-meta .row:last-child{padding-bottom:0;margin-bottom:0;border-bottom:0}
.p-meta .lbl{font-size:9.5px;font-weight:700;color:var(--pc)}
.p-meta input{border:0;background:transparent;text-align:center;font-weight:700;color:var(--pi);width:100%;outline:none;font-size:13px}
.p-meta .dt{display:flex;gap:4px}
.p-meta .val{font-weight:700;font-size:13px}

.sec-h{display:flex;align-items:center;gap:10px;padding:8px 18px;background:var(--ph);border-top:1px solid var(--pl);border-bottom:2px solid var(--pc);color:var(--pi);font-weight:800;font-size:13.5px}
.sec-h .n{width:24px;height:24px;border-radius:50%;background:var(--pi);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;flex:none}
.sec-h .en{font-family:Georgia,serif;font-weight:600;font-size:11px;color:var(--pm);padding-right:10px;border-right:2px solid var(--pc)}
.sec-b{padding:14px 18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.fg{display:flex;flex-direction:column;gap:4px;min-width:0}
.fg.full{grid-column:1/-1}
.fg .lab{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--pm)}
.fg input,.fg select,.fg textarea{border:1px solid var(--pl);border-radius:5px;padding:8px 10px;background:var(--pf);color:var(--pi);outline:none;width:100%;min-width:0;font-family:var(--f-paper);font-size:13px}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--pc);background:#fff}
.fg textarea{resize:vertical;min-height:62px;line-height:1.6}
.fg.off{opacity:.4}
.eye{width:26px;height:24px;border-radius:5px;border:1px solid var(--pl);background:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--pm);padding:0}
.eye svg{width:15px;height:15px}
.fg.off .eye,.sig.off .eye{background:var(--bad);border-color:var(--bad);color:#fff}
.v{border:1px solid #CFC8BC;border-radius:4px;background:var(--pf);padding:6px 9px;font-weight:600;min-height:30px;white-space:pre-wrap;word-break:break-word;color:#111}
.v.ltr{direction:ltr;text-align:right}

.photo-field .drop{border:2px dashed var(--pl);border-radius:8px;background:var(--pf);min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;color:var(--pm);font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pb{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:6px;padding:8px 12px;background:var(--pi);color:#fff;font-size:12px;font-weight:700;min-height:36px}
.pb.alt{background:var(--pc)}
.pb svg{width:15px;height:15px}
.pb.ghost{background:#fff;color:var(--pi);border:1px solid var(--pl)}
.ph-img{position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--pl)}
.ph-img img{display:block;width:100%;height:220px;object-fit:contain;background:#F2EFEA}
.slot .ph-img img{height:170px}
.ph-img.zoom{cursor:zoom-in}
.ph-zoom{position:absolute;bottom:6px;left:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;pointer-events:none}
.ph-zoom svg{width:15px;height:15px}
.ph-cap{background:var(--pi);color:#fff;text-align:center;font-weight:700;font-size:12px;padding:6px 10px}
.x{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:5px;padding:4px 9px;font-size:11px}
.loc-row{display:flex;gap:8px;flex-wrap:wrap}
.loc-row input{flex:1 1 220px;direction:ltr;text-align:right}
.loc-link{display:inline-flex;gap:6px;align-items:center;margin-top:6px;color:var(--pc);font-weight:700;font-size:12px;word-break:break-all}
.hint{font-size:11px;color:var(--pm);margin-top:4px}

table.chk{width:100%;border-collapse:collapse}
.chk th{background:var(--pi);color:#fff;padding:8px 10px;font-size:11px;font-weight:700;text-align:center}
.chk th:first-child{text-align:right}
.chk td{padding:7px 10px;border-bottom:1px solid #EEE9E1;vertical-align:middle;font-size:12.5px}
.chk tr:nth-child(even) td{background:#FBF9F5}
.chk .it small{display:block;color:var(--pm);font-family:Georgia,serif;font-size:10.5px;direction:ltr;text-align:right}
.rb{width:36px;height:30px;border-radius:5px;border:1.5px solid var(--pl);background:#F3F0EA;font-weight:800;font-size:13px;color:var(--pm)}
.rb.ok.on{background:#DDF1E5;border-color:var(--ok);color:var(--ok)}
.rb.fail.on{background:#FBE3E1;border-color:var(--bad);color:var(--bad)}
.rb.na.on{background:#E9E7E3;border-color:#77716B;color:#4D4844}
.note{width:100%;border:1px solid var(--pl);border-radius:4px;padding:5px 8px;font-size:12px;background:#fff;min-height:30px;resize:none;overflow:hidden;font-family:var(--f-paper);color:var(--pi)}
.mark{display:inline-flex;width:30px;height:26px;border:1.5px solid #333;border-radius:4px;align-items:center;justify-content:center;font-weight:800}
.empty{padding:22px;text-align:center;color:var(--pm)}

.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.slot{border:1px solid var(--pl);border-radius:6px;overflow:hidden;background:#fff}
.slot textarea{width:100%;border:0;border-top:1px solid var(--pl);padding:7px 9px;font-size:12px;resize:none;min-height:40px;background:var(--pf);font-family:var(--f-paper);color:var(--pi)}
.slot .cap{border-top:1px solid var(--pl);padding:6px 9px;font-size:12px;font-weight:600;white-space:pre-wrap}
.slot.odd-last{grid-column:1/-1;width:70%;justify-self:center}

.dec{display:grid;grid-template-columns:repeat(var(--dn,3),minmax(0,1fr));gap:12px;margin-bottom:14px}
.dc{border:2px solid var(--pl);border-radius:9px;padding:14px 8px;text-align:center;background:#fff;color:var(--pi)}
.dc .ic{width:30px;height:30px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.dc b{display:block;font-size:14px}
.dc small{display:block;font-size:10.5px;color:var(--pm);font-family:Georgia,serif;margin-top:2px}
.dec.has .dc:not(.on){opacity:.3}

.sigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sig{border:1px solid var(--pl);border-radius:7px;overflow:hidden}
.sig.off{opacity:.42}
.sig-h{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--ph);border-bottom:1px solid var(--pl);padding:7px 12px;font-weight:800;font-size:12px}
.sig-b{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.sf{display:flex;flex-direction:column;gap:2px}
.sf label{font-size:10px;font-weight:700;color:var(--pm)}
.sf input,.sf select{border:0;border-bottom:1.5px dashed var(--pl);padding:4px 2px;background:transparent;outline:none;font-family:var(--f-paper);font-size:13px;color:var(--pi)}
.pad{position:relative;border:1px dashed var(--pl);border-radius:5px;background:var(--pf)}
.pad canvas{display:block;width:100%;height:96px;touch-action:none;cursor:crosshair}
.pad span{position:absolute;top:4px;right:8px;font-size:10px;color:#AAA;pointer-events:none}
.pad button{position:absolute;bottom:4px;left:6px;font-size:10px;border:1px solid var(--pl);background:#fff;border-radius:4px;padding:2px 8px;color:var(--pm)}
.sig-line{border-top:1.5px solid #444;margin-top:8px;min-height:40px;display:flex;align-items:flex-end;justify-content:center}
.sig-line img{max-height:64px}

.p-foot{background:var(--pi);color:#F3EDE2;padding:14px 20px;text-align:center;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--pc)}
.p-foot b{font-size:14px;color:#fff}
.p-foot .c{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;font-size:12px}
.p-foot .c span{white-space:nowrap}

@container (max-width:600px){
  .p-head{grid-template-columns:1fr;justify-items:center;text-align:center}
  .p-meta{width:100%;max-width:300px}
  .grid,.photos,.sigs{grid-template-columns:1fr}
  .dec{grid-template-columns:1fr}
  .slot.odd-last{width:100%}
  table.chk,.chk tbody{display:block;width:100%}
  .chk thead{display:none}
  .chk tr{display:block;border:1px solid var(--pl);border-radius:8px;padding:10px 12px;margin:0 12px 10px;background:#fff}
  .chk tr:nth-child(even) td{background:transparent}
  .chk td{display:block;border:0;padding:0}
  .chk td.it{margin-bottom:8px;font-weight:700}
  .chk td.r{display:inline-block;margin-left:8px}
  .chk td.nt{margin-top:8px}
  .fg input,.fg select,.fg textarea,.note,.sf input,.sf select{font-size:16px}
}

/* ---------- admin ---------- */
.adm{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.adm-tabs{display:flex;gap:4px;overflow-x:auto;padding:8px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.adm-tab{border:0;background:transparent;padding:9px 14px;border-radius:8px;font-weight:600;white-space:nowrap;color:var(--fg-muted);min-height:40px}
.adm-tab.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.adm-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.adm-foot{position:sticky;bottom:0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.adm-foot .st{font-size:12.5px;color:var(--fg-muted);flex:1 1 200px}
.ab{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;min-height:36px}
.ab:hover{border-color:var(--gold)}
.ab.pri{background:var(--gold);border-color:var(--gold);color:#fff}
.ab.dang{color:var(--bad)}
.ab.icon{padding:6px 9px}
.ab svg{width:15px;height:15px}
.ab[disabled]{opacity:.4;cursor:not-allowed}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:14px;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-h .t{font-weight:700;flex:1 1 160px;min-width:0}
.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;background:var(--gold-soft);color:var(--fg);font-size:11.5px;font-weight:700;white-space:nowrap}
.flds{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.af{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fg-muted);min-width:0}
.af input,.af select,.af textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);width:100%;min-width:0}
.af textarea{min-height:110px;line-height:1.7;resize:vertical}
.af.chk-l{flex-direction:row;align-items:center;gap:8px;color:var(--fg)}
.af.chk-l input{width:auto}
.frow{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:8px}
.frow-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.frow-h .t{flex:1 1 140px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-acts{display:flex;gap:4px;flex-wrap:wrap}
.adm-note{font-size:12.5px;color:var(--fg-muted);line-height:1.7;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.logo-prev{width:96px;height:96px;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;background:#fff}
.logo-prev img{max-width:88px;max-height:88px}
.inline-confirm{display:inline-flex;gap:6px;align-items:center}
.hidden-file{position:fixed!important;left:0;top:0;width:1px!important;height:1px!important;max-width:1px;opacity:0;pointer-events:none;overflow:hidden}
html,body{overflow-x:hidden}
.login{max-width:420px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.login h2{margin:0;font-family:var(--f-display);font-size:20px}
.login p{margin:0;color:var(--fg-muted);font-size:13px;line-height:1.7}
.login .err{color:var(--bad);font-size:12.5px}
@media print{@page{size:A4;margin:8mm}body{background:#fff!important}body::before,.bar,.preview-banner,.toast{display:none!important}.wrap{max-width:none;padding:0}.paper{box-shadow:none;border-radius:0}.brk{break-inside:avoid}.sec-h{break-after:avoid}.p-head,.sec-h,.chk th,.p-foot,.dc,.mark,.ph-cap{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* ---------- motion: logo loop (4s moving, 2s still) + contact icons ---------- */
.p-logo .lg{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;animation:logoLoop 6s ease-in-out infinite}
.p-logo .lg img{width:100%;height:100%;object-fit:contain;display:block}
.p-logo .lg::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,244,214,.95) 48%,transparent 66%);background-size:250% 100%;background-position:130% 0;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;animation:logoShine 6s ease-in-out infinite;pointer-events:none}
@keyframes logoLoop{
  0%{transform:perspective(500px) translateY(0) rotateY(0) scale(1)}
  12%{transform:perspective(500px) translateY(-7px) rotateY(16deg) scale(1.04)}
  26%{transform:perspective(500px) translateY(0) rotateY(0) scale(1)}
  40%{transform:perspective(500px) translateY(-7px) rotateY(-16deg) scale(1.04)}
  54%{transform:perspective(500px) translateY(2px) rotateY(0) scale(.98)}
  66.6%,100%{transform:perspective(500px) translateY(0) rotateY(0) scale(1)}}
@keyframes logoShine{0%{background-position:130% 0}55%,100%{background-position:-30% 0}}
.p-foot .c{gap:10px 22px;align-items:center}
.fi{display:inline-flex;align-items:center;gap:9px;color:inherit;text-decoration:none;text-align:right}
a.fi:hover .tx>span,.fi .nums a:hover{text-decoration:underline}
.fi .tx{display:flex;flex-direction:column;line-height:1.35}
.fi .tx small{font-size:10px;opacity:.7;font-weight:700}
.fi .nums{display:flex;gap:10px;flex-wrap:wrap}
.fi .nums a{color:inherit;text-decoration:none;font-weight:700;letter-spacing:.3px}
.fi .ic{position:relative;width:30px;height:30px;border-radius:50%;background:var(--pc);display:inline-flex;align-items:center;justify-content:center;flex:none}
.fi .ic svg{width:15px;height:15px}
.fi .ic::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--pc);animation:ping 2.6s ease-out infinite}
.fi-loc .ic svg{animation:pinDrop 2.6s ease-in-out infinite}
.fi-tel .ic svg,.fi-wa .ic svg{animation:ring 2.6s ease-in-out infinite;transform-origin:50% 60%}
.fi-mail .ic svg{animation:mailFloat 2.6s ease-in-out infinite}
.fi-tel .ic::after{animation-delay:.4s}.fi-mail .ic::after{animation-delay:.8s}.fi-wa .ic::after{animation-delay:1.2s}
@keyframes ping{0%{transform:scale(1);opacity:.75}70%,100%{transform:scale(1.75);opacity:0}}
@keyframes pinDrop{0%,50%,100%{transform:translateY(0)}62%{transform:translateY(-5px)}74%{transform:translateY(0)}82%{transform:translateY(-2px)}90%{transform:translateY(0)}}
@keyframes ring{0%,55%,100%{transform:rotate(0)}60%{transform:rotate(-18deg)}65%{transform:rotate(16deg)}70%{transform:rotate(-14deg)}75%{transform:rotate(12deg)}80%{transform:rotate(-6deg)}85%{transform:rotate(0)}}
@keyframes mailFloat{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-3px) rotate(-8deg)}60%{transform:translateY(0) rotate(4deg)}}
.paper.exporting *,.paper.exporting *::after{animation:none!important}
@media print{.paper *,.paper *::after{animation:none!important}}

/* ---------- photo viewer ---------- */
.lb{position:fixed;inset:0;z-index:95;background:rgba(12,11,9,.94);display:flex;align-items:center;justify-content:center;padding:calc(68px + env(safe-area-inset-top,0px)) 12px calc(20px + env(safe-area-inset-bottom,0px))}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.lb-x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center}
.lb.sheet{align-items:flex-end;background:rgba(12,11,9,.55)}
.sheet-in{background:var(--surface);color:var(--fg);border-radius:14px;padding:18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;text-align:center}
.sheet-in span{font-size:12.5px;color:var(--fg-muted);word-break:break-all}
.sheet-in .ab{justify-content:center;min-height:44px}
/* ---------- date/time refresh ---------- */
.p-meta .dt{align-items:center}
.p-meta .dt input{min-width:0;flex:1 1 auto}
.now{flex:none;width:28px;height:28px;border:1px solid var(--pl);border-radius:6px;background:#fff;color:var(--pc);display:inline-flex;align-items:center;justify-content:center;padding:0}
.now svg{width:14px;height:14px}
/* ---------- phone: compact icon tool bar ---------- */
@media (max-width:640px){
  .bar-in{flex-wrap:nowrap;gap:6px;padding-block:8px}
  .bar-title{flex:1 1 auto;min-width:0}
  .bar-title b,.bar-title small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-title b{font-size:14px}
  .bar-title small{font-size:10.5px}
  .save-badge{display:none}
  .tb{width:38px;height:38px;min-height:38px;padding:0;justify-content:center;flex:none}
  .tb span{display:none}
  .tb.wide{width:auto;padding:0 10px}
  .tb.wide span{display:inline}
  .wrap{padding-top:12px}
}
@media print{.ph-img img{height:300px!important}.slot .ph-img img{height:220px!important}.ph-zoom,.now{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function eyeBtn(id,off){return '<button type="button" class="eye" data-hide="'+esc(id)+'" aria-pressed="'+(off?'true':'false')+'" title="'+(off?'إظهار في التقرير':'إخفاء من التقرير')+'" aria-label="'+(off?'إظهار في التقرير':'إخفاء من التقرير')+'">'+ICON.eye+'</button>'}
function selectedType(cfg){
  var tid='';cfg.sections.forEach(function(s){(s.fields||[]).forEach(function(f){if(f.type==='inspectionType')tid=fieldVal(f.id)})});
  var t=null;cfg.types.forEach(function(x){if(x.id===tid)t=x});return t;
}
function fieldHTML(f,mode,cfg){
  var off=!!S.hidden[f.id], v=fieldVal(f.id), cls='fg brk'+(f.width==='full'||f.type==='textarea'||f.type==='photo'||f.type==='location'?' full':'');
  if(mode!=='edit'){
    if(off) return '';
    var shown=v;
    if(f.type==='inspectionType'){var t=selectedType(cfg);shown=t?t.label:''}
    if(f.type==='select'&&v==='__other') shown=fieldVal(f.id+'__other');
    if(f.type==='photo'){ if(!v) return ''; return '<div class="'+cls+'"><span class="lab">'+esc(f.label)+(f.en?' / '+esc(f.en):'')+'</span><div class="ph-img"><img src="'+v+'" alt=""></div>'+(f.caption?'<div class="ph-cap">'+esc(f.caption)+'</div>':'')+'</div>'}
    if(f.type==='location'){ if(!v) return ''; return '<div class="'+cls+'"><span class="lab">'+esc(f.label)+(f.en?' / '+esc(f.en):'')+'</span><div class="v ltr">'+esc(v)+'</div></div>'}
    return '<div class="'+cls+'"><span class="lab">'+esc(f.label)+(f.en?' / '+esc(f.en):'')+'</span><div class="v">'+esc(shown||'—')+'</div></div>';
  }
  var id='f-'+f.id, lab='<span class="lab"><label for="'+id+'">'+esc(f.label)+(f.en?' / '+esc(f.en):'')+'</label>'+(f.hideable?eyeBtn(f.id,off):'')+'</span>', inp='';
  switch(f.type){
    case 'textarea': inp='<textarea id="'+id+'" data-f="'+esc(f.id)+'" rows="2" placeholder="'+esc(f.placeholder||'')+'">'+esc(v)+'</textarea>';break;
    case 'number': case 'date': case 'time': inp='<input id="'+id+'" type="'+f.type+'" data-f="'+esc(f.id)+'" value="'+esc(v)+'">';break;
    case 'select':
      inp='<select id="'+id+'" data-f="'+esc(f.id)+'" data-rr="1"><option value="">-- اختر --</option>'+(f.options||[]).map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>'}).join('')+(f.allowOther?'<option value="__other"'+(v==='__other'?' selected':'')+'>أخرى (اكتب يدوياً)</option>':'')+'</select>';
      if(f.allowOther&&v==='__other') inp+='<input id="'+id+'-o" data-f="'+esc(f.id)+'__other" value="'+esc(fieldVal(f.id+'__other'))+'" placeholder="اكتب هنا..." style="margin-top:6px">';
      break;
    case 'inspectionType':
      inp='<select id="'+id+'" data-f="'+esc(f.id)+'" data-rr="1"><option value="">-- اختر النوع --</option>'+cfg.types.map(function(t){return '<option value="'+esc(t.id)+'"'+(t.id===v?' selected':'')+'>'+esc(t.label)+'</option>'}).join('')+'</select>';break;
    case 'photo':
      if(v) inp='<div class="ph-img zoom"><img src="'+v+'" alt="'+esc(f.label)+' — اضغط للتكبير"><span class="ph-zoom">'+ICON.zoom+'</span><button type="button" class="x" data-rmf="'+esc(f.id)+'">إزالة</button></div>'+(f.caption?'<div class="ph-cap">'+esc(f.caption)+'</div>':'');
      else inp='<div class="photo-field"><div class="drop"><span>'+esc(f.label)+'</span><div class="btns"><label class="pb alt">'+ICON.cam+'التقاط بالكاميرا<input class="hidden-file" type="file" accept="image/*" capture="environment" data-pf="'+esc(f.id)+'"></label><label class="pb">'+ICON.img+'من المعرض<input class="hidden-file" type="file" accept="image/*" data-pf="'+esc(f.id)+'"></label></div></div></div>';
      lab='<span class="lab">'+esc(f.label)+(f.en?' / '+esc(f.en):'')+(f.hideable?eyeBtn(f.id,off):'')+'</span>';
      break;
    case 'location':
      inp='<div class="loc-row">'+(navigator.geolocation?'<button type="button" class="pb alt" data-gps="'+esc(f.id)+'">'+ICON.pin+'تحديد موقعي الحالي</button>':'')+'<input id="'+id+'" data-f="'+esc(f.id)+'" value="'+esc(v)+'" placeholder="أو الصق رابط الموقع من خرائط جوجل"></div>'+(/^https?:\/\//.test(v)?'<a class="loc-link" href="'+esc(v)+'" target="_blank" rel="noopener">'+ICON.pin+'فتح في الخرائط</a>':'<div class="hint">افتح خرائط جوجل، اضغط مطوّلاً على المبنى، انسخ الرابط والصقه هنا.</div>');
      break;
    default: inp='<input id="'+id+'" data-f="'+esc(f.id)+'" value="'+esc(v)+'" placeholder="'+esc(f.placeholder||'')+'">';
  }
  return '<div class="'+cls+(off?' off':'')+'">'+lab+inp+'</div>';
}
function sectionHTML(s,i,mode,cfg){
  var head='<div class="sec-h brk"><span class="n">'+(i+1)+'</span><span>'+esc(s.title)+'</span>'+(s.en?'<span class="en">'+esc(s.en)+'</span>':'')+'</div>';
  var b='';
  if(s.type==='fields'){
    var inner=(s.fields||[]).map(function(f){return fieldHTML(f,mode,cfg)}).join('');
    if(mode!=='edit'&&!inner) return '';
    b='<div class="sec-b"><div class="grid">'+inner+'</div></div>';
  }else if(s.type==='checklist'){
    var t=selectedType(cfg);
    if(!t||!t.items.length){ if(mode!=='edit') return ''; b='<div class="empty">اختر نوع الاستلام أولاً لتظهر بنود الفحص المناسبة</div>'}
    else{
      var ck=S.checks[t.id]||{};
      b='<table class="chk"><thead><tr><th>البند / Item</th><th>مطابق</th><th>غير مطابق</th><th>لا ينطبق</th><th style="width:34%">ملاحظات / Remarks</th></tr></thead><tbody>'+
        t.items.map(function(it,k){var c=ck[k]||{};
          var cell=function(code,sym,label){ if(mode==='edit') return '<td class="r" style="text-align:center"><button type="button" class="rb '+code+(c.s===code?' on':'')+'" data-chk="'+k+'" data-v="'+code+'" aria-pressed="'+(c.s===code)+'" aria-label="'+label+'">'+sym+'</button></td>'; return '<td class="r" style="text-align:center">'+(c.s===code?'<span class="mark">'+sym+'</span>':'')+'</td>'};
          return '<tr class="brk"><td class="it">'+esc(it.ar)+(it.en?'<small>'+esc(it.en)+'</small>':'')+'</td>'+cell('ok','✓','مطابق')+cell('fail','✗','غير مطابق')+cell('na','—','لا ينطبق')+
            '<td class="nt">'+(mode==='edit'?'<textarea class="note" rows="1" data-note="'+k+'" aria-label="ملاحظة">'+esc(c.n||'')+'</textarea>':esc(c.n||''))+'</td></tr>'}).join('')+'</tbody></table>';
    }
  }else if(s.type==='photos'){
    var ph=S.photos;
    if(mode!=='edit'&&!ph.length) return '';
    b='<div class="sec-b"><div class="photos">'+ph.map(function(p,k){var odd=(k===ph.length-1&&ph.length%2===1)?' odd-last':'';
      if(mode==='edit') return '<div class="slot'+odd+'"><div class="ph-img zoom" style="border:0;border-radius:0"><img src="'+p.src+'" alt="صورة '+(k+1)+' — اضغط للتكبير"><span class="ph-zoom">'+ICON.zoom+'</span><button type="button" class="x" data-rmp="'+k+'">إزالة</button></div><textarea data-cap="'+k+'" placeholder="وصف الصورة..." aria-label="وصف الصورة '+(k+1)+'">'+esc(p.cap||'')+'</textarea></div>';
      return '<div class="slot brk'+odd+'"><div class="ph-img" style="border:0;border-radius:0"><img src="'+p.src+'" alt=""></div>'+(p.cap?'<div class="cap">'+esc(p.cap)+'</div>':'')+'</div>'}).join('')+'</div>'+
      (mode==='edit'?'<div class="btns" style="justify-content:flex-start;margin-top:12px"><label class="pb alt">'+ICON.cam+'التقاط بالكاميرا<input class="hidden-file" type="file" accept="image/*" capture="environment" data-addp="1"></label><label class="pb">'+ICON.plus+'إضافة صور من المعرض<input class="hidden-file" type="file" accept="image/*" multiple data-addp="1"></label></div>'+(ph.length?'':'<div class="hint">لم تُضف صور بعد. يمكنك إضافة أكثر من صورة مرة واحدة.</div>'):'')+'</div>';
  }else if(s.type==='decision'){
    var decs=cfg.decisions, has=!!S.decision;
    if(mode!=='edit'&&!has&&!fieldVal('notes_'+s.id)) return '';
    b='<div class="sec-b"><div class="dec'+(has?' has':'')+' brk" style="--dn:'+Math.min(decs.length,3)+'">'+decs.map(function(d){var on=S.decision===d.id;
      var inner='<span class="ic" style="background:'+esc(d.color)+'">'+(on?'✓':'')+'</span><b>'+esc(d.ar)+'</b><small>'+esc(d.en||'')+'</small>';
      return mode==='edit'?'<button type="button" class="dc'+(on?' on':'')+'" data-dec="'+esc(d.id)+'" aria-pressed="'+on+'" style="'+(on?'border-color:'+esc(d.color):'')+'">'+inner+'</button>':'<div class="dc'+(on?' on':'')+'" style="'+(on?'border-color:'+esc(d.color):'')+'">'+inner+'</div>'}).join('')+'</div>'+
      fieldHTML({id:'notes_'+s.id,type:'textarea',label:s.notesLabel||'الملاحظات والشروط',en:s.notesEn||'Notes & Conditions',width:'full',placeholder:'أدخل الملاحظات أو الشروط المطلوبة...'},mode,cfg)+'</div>';
  }else if(s.type==='signatures'){
    var boxes=cfg.signatures.filter(function(g){return mode==='edit'||!S.hidden['sig_'+g.id]});
    if(!boxes.length) return '';
    b='<div class="sec-b"><div class="sigs brk" style="'+(boxes.length===1?'grid-template-columns:minmax(0,1fr);max-width:520px;margin:0 auto':'')+'">'+boxes.map(function(g){
      var sg=S.sigs[g.id]||{}, off=!!S.hidden['sig_'+g.id];
      var nameIn;
      if(mode==='edit'){
        nameIn=(g.nameMode==='list'&&cfg.engineers.length)?'<select id="sg-'+g.id+'-n" data-sg="'+g.id+'" data-k="name"><option value="">-- اختر --</option>'+cfg.engineers.map(function(e){return '<option'+(e===sg.name?' selected':'')+'>'+esc(e)+'</option>'}).join('')+'</select>':'<input id="sg-'+g.id+'-n" data-sg="'+g.id+'" data-k="name" value="'+esc(sg.name||'')+'" placeholder="الاسم">';

          '<div class="sf"><label for="sg-'+g.id+'-t">المسمى الوظيفي / Title</label><input id="sg-'+g.id+'-t" data-sg="'+g.id+'" data-k="title" value="'+esc(sg.title||'')+'"></div>'+
          '<div class="sf"><label for="sg-'+g.id+'-d">التاريخ / Date</label><input id="sg-'+g.id+'-d" type="date" data-sg="'+g.id+'" data-k="date" value="'+esc(sg.date||'')+'"></div>'+
          '<div class="pad"><canvas data-pad="'+g.id+'" aria-label="لوحة التوقيع"></canvas><span>التوقيع / Signature — وقّع هنا</span><button type="button" data-clr="'+g.id+'">مسح</button></div></div></div>';
      }
      return '<div class="sig"><div class="sig-h"><span>'+esc(g.title)+(g.en?' / '+esc(g.en):'')+'</span></div><div class="sig-b">'+
        '<div class="sf"><label>الاسم / Name</label><div class="v">'+esc(sg.name||'')+'</div></div>'+
        '<div class="sf"><label>المسمى الوظيفي / Title</label><div class="v">'+esc(sg.title||'')+'</div></div>'+
        '<div class="sf"><label>التاريخ / Date</label><div class="v">'+esc(sg.date||'')+'</div></div>'+
        '<div class="sf"><label>التوقيع / Signature</label><div class="sig-line">'+(sg.img?'<img src="'+sg.img+'" alt="">':'')+'</div></div></div></div>';
    }).join('')+'</div></div>';
  }
  return '<section>'+head+b+'</section>';
}
function footHTML(cfg){
  var co=cfg.company, items=[];
  var IC={loc:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
    tel:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
    wa:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/><path d="M9 9.5c.5 2 2.5 4 4.5 4.5l1.2-1.2 2 .8v1.6c-4 .5-8.5-4-8-8h1.6l.8 2z"/></svg>',
    mail:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>'};
  function item(kind,href,label,body,ltr){
    return '<a class="fi fi-'+kind+'" href="'+esc(href)+'"'+(kind==='loc'?' target="_blank" rel="noopener"':'')+'><span class="ic">'+IC[kind]+'</span><span class="tx">'+(label?'<small>'+label+'</small>':'')+'<span'+(ltr?' dir="ltr"':'')+'>'+body+'</span></span></a>';
  }
  function nums(str){return String(str).split(/\s*[·,،\/|]\s*|\s{2,}|\s+-\s+/).map(function(x){return x.trim()}).filter(Boolean)}
  (co.branches||[]).forEach(function(b){if(b)items.push(item('loc','https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(b),'العنوان',esc(b)))});
  if(co.phone) items.push('<span class="fi fi-tel"><span class="ic">'+IC.tel+'</span><span class="tx"><small>للتواصل</small><span class="nums">'+nums(co.phone).map(function(n){return '<a dir="ltr" href="tel:'+esc(n.replace(/[^\d+]/g,''))+'">'+esc(n)+'</a>'}).join('')+'</span></span></span>');
  if(co.whatsapp) items.push(item('wa','https://wa.me/'+String(co.whatsapp).replace(/\D/g,'').replace(/^0/,'966'),'واتساب',esc(co.whatsapp),true));
  if(co.email) items.push(item('mail','mailto:'+co.email,'البريد الإلكتروني',esc(co.email),true));
  if(co.footerNote) items.push('<span class="fi"><span class="tx"><span>'+esc(co.footerNote)+'</span></span></span>');
  return '<div class="p-foot brk"><b>'+esc(co.nameAr)+'</b>'+(items.length?'<div class="c">'+items.join('')+'</div>':'')+'</div>';
}
function renderPaper(el,mode,cfg){
  el.style.setProperty('--pc',cfg.theme.primary||'#B8822B');
  el.style.setProperty('--pi',cfg.theme.ink||'#231F20');
  var n=0;
  var secs=cfg.sections.filter(function(s){return s.enabled!==false}).map(function(s){var h=sectionHTML(s,n,mode,cfg);if(h)n++;return h}).join('');
  el.innerHTML=headHTML(cfg,mode)+secs+footHTML(cfg);
  if(mode==='edit'){initPads(el);$$('textarea',el).forEach(grow)}
}
function grow(t){t.style.height='auto';t.style.height=Math.max(t.scrollHeight,t.classList.contains('note')?30:62)+'px'}

/* ---------- form events ---------- */
function bindForm(){
  $('#b-new').onclick=function(){var b=this;if(b.dataset.c){S=blankState();autosave();render();toast('بدأ تقرير جديد');return}b.dataset.c='1';b.classList.add('wide');b.querySelector('span').textContent='اضغط للتأكيد';setTimeout(function(){if(b.isConnected){delete b.dataset.c;b.classList.remove('wide');b.querySelector('span').textContent='تقرير جديد'}},3500)};

function openViewer(src){
  var d=document.createElement('div');d.className='lb';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-label','عرض الصورة');
  d.innerHTML='<img src="'+src+'" alt=""><button type="button" class="lb-x" aria-label="إغلاق">✕</button>';
  var prev=document.activeElement;
  function close(){document.removeEventListener('keydown',key);d.remove();document.documentElement.style.overflow='';if(prev&&prev.focus)prev.focus()}
  function key(e){if(e.key==='Escape')close()}
  d.addEventListener('click',function(e){if(e.target.tagName!=='IMG')close()});
  document.addEventListener('keydown',key);
  document.documentElement.style.overflow='hidden';
  document.body.appendChild(d);d.querySelector('.lb-x').focus();
}

  root.addEventListener('change',function(e){var t=e.target;
    if(t.id==='a-logo'&&t.files[0]){var f=t.files[0];var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);DRAFT.company.logo=c.toDataURL('image/png');markDirty();reAdmin()};im.src=r.result};r.readAsDataURL(f);return}
    if(t.id==='a-import'&&t.files[0]){var r2=new FileReader();r2.onload=function(){try{var o=JSON.parse(r2.result);if(!o.sections||!o.company)throw 0;DRAFT=o;markDirty();reAdmin();toast('تم استيراد الإعدادات. اضغط «حفظ وتنزيل الملف المحدّث» لتطبيقها.')}catch(x){toast('الملف غير صالح. اختر ملف إعدادات نزّلته من هنا.')}};r2.readAsText(t.files[0]);return}
    if(t.dataset.move&&t.value!==''){var ij=t.dataset.move.split('.'),from=DRAFT.sections[+ij[0]].fields,f=from.splice(+ij[1],1)[0];DRAFT.sections[+t.value].fields.push(f);markDirty();reAdmin()}
  });
  root.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
    if(b.dataset.tab){admTab=b.dataset.tab;render();return}
    if(b.dataset.act){var kind=b.dataset.kind,i=+b.dataset.i,arr;
      if(kind==='sec')arr=DRAFT.sections;else if(kind==='type')arr=DRAFT.types;else if(kind==='sig')arr=DRAFT.signatures;else if(kind==='dec')arr=DRAFT.decisions;else if(kind.indexOf('fld:')===0)arr=DRAFT.sections[+kind.slice(4)].fields;
      if(b.dataset.act==='del'){if(!b.dataset.c){b.dataset.c='1';b.classList.add('pri');b.setAttribute('aria-label','اضغط مرة أخرى للحذف');b.title='اضغط مرة أخرى للحذف';setTimeout(function(){if(b.isConnected){delete b.dataset.c;b.classList.remove('pri')}},3000);return}arr.splice(i,1)}
      else{var j=b.dataset.act==='up'?i-1:i+1;if(j<0||j>=arr.length)return;var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp}
      markDirty();reAdmin();return}
    if(b.dataset.add){var a=b.dataset.add;
      if(a==='field')DRAFT.sections[+b.dataset.i].fields.push(newField());
      if(a==='sec'){var t=b.dataset.t,s={id:uid('s'),type:t,title:SEC_LABEL[t],en:'',enabled:true};if(t==='fields')s.fields=[newField()];DRAFT.sections.push(s)}
      if(a==='type')DRAFT.types.push({id:uid('t'),label:'نوع جديد',items:[]});
      if(a==='sig')DRAFT.signatures.push({id:uid('g'),title:'توقيع جديد',en:'',nameMode:'text',hideable:true});
      if(a==='dec')DRAFT.decisions.push({id:uid('d'),ar:'خيار جديد',en:'',color:'#6B6460'});
      markDirty();reAdmin();return}
    if(b.id==='a-discard'){DRAFT=clone(CFG);dirty=false;reAdmin();toast('أُلغيت التعديلات');return}
    if(b.id==='a-defaults'){DRAFT=clone(DEFAULT);markDirty();reAdmin();toast('رجعت الإعدادات الأصلية. اضغط «حفظ وتنزيل الملف المحدّث» لتطبيقها.');return}
    if(b.id==='a-export'){saveFile('asas-ir-settings.json',new Blob([JSON.stringify(DRAFT,null,2)],{type:'application/json'})).then(function(){toast('تم تنزيل ملف الإعدادات')});return}
    if(b.id==='a-save'){publishCfg(b);return}
  });
}
function buildDoc(cfg){
  var json=JSON.stringify(cfg).replace(/</g,'\\u003c');
  var S1='<scr'+'ipt';var S2='</scr'+'ipt>';
  return '<!doctype html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n<title>'+esc(TITLE_TXT)+'</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="'+FONTS+'">\n'+
    '<style>'+BASE_CSS+'</style>\n<style id="st">'+STYLE_TXT+'</style>\n</head>\n<body>\n<div id="app-root"></div>\n'+
    S1+' type="application/json" id="cfg">'+json+S2+'\n'+
    S1+' id="app">'+APP_TXT+S2+'\n</body>\n</html>\n';
}
async function publishCfg(btn){
  var st=$('#a-status');
  CFG=clone(DRAFT);dirty=false;
  await saveFile('index.html',new Blob([buildDoc(CFG)],{type:'text/html'}));
  btn.disabled=true;$('#a-discard').disabled=true;
  if(st)st.textContent='نزل ملف index.html المحدّث. ارفعه على الاستضافة مكان القديم ليظهر التعديل للجميع.';
}
/* ---------- boot ---------- */
render();
autosave();
})();
</script>
